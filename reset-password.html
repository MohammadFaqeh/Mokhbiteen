<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور | مشروع المخبتين القرآني</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css?v=20260807-10">
  <style>
    body{min-height:100vh;background:linear-gradient(160deg,var(--navy-deep),var(--teal));display:grid;place-items:center;padding:20px}
    .reset-box{width:min(390px,100%);background:var(--paper);border-radius:var(--radius-lg);padding:36px 30px;text-align:center;box-shadow:var(--shadow-deep)}
    .reset-box img{width:66px;margin:0 auto 14px}.reset-box h1{font-family:var(--font-display);font-size:1.4rem;color:var(--navy-deep);margin:0 0 8px}
    .reset-box p{color:var(--ink-soft);font-size:.86rem;line-height:1.8}.reset-box input{width:100%;padding:12px 14px;border:1.5px solid rgba(31,107,82,.25);border-radius:10px;background:var(--cream-soft);font:inherit;text-align:center;margin:8px 0}
    .reset-box input:focus{outline:none;border-color:var(--gold)}.reset-box button{width:100%;margin-top:10px}.reset-message{min-height:22px;margin-top:13px;font-size:.82rem;color:#b8563f}.reset-success{color:var(--emerald)}
    .reset-back{display:inline-block;margin-top:16px;color:var(--emerald);font-weight:700;font-size:.82rem}
  </style>
</head>
<body>
  <main class="reset-box">
    <img src="assets/logo.png" alt="شعار المشروع">
    <h1>تعيين كلمة مرور جديدة</h1>
    <p id="resetHelp">افتح هذه الصفحة من رابط الاستعادة الذي وصلك على البريد، ثم اكتب كلمة المرور الجديدة.</p>
    <form id="resetPasswordForm">
      <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" minlength="8" autocomplete="new-password" required>
      <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" minlength="8" autocomplete="new-password" required>
      <button class="btn btn-gold" type="submit">حفظ كلمة المرور الجديدة</button>
    </form>
    <div class="reset-message" id="resetMessage"></div>
    <a class="reset-back" href="admin.html">العودة إلى لوحة التحكم</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260803-3"></script>
  <script src="reset-password.js?v=20260808-1"></script>
</body>
</html>
